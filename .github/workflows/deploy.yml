# Deploys this repo's Worker on every push to main. Replace the placeholders (worker name in wrangler.jsonc) after creating the repo.
# Needs the organisation secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the run says so and skips.
name: Deploy

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets in this repo yet (set as organisation secrets); skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0   # stamp-versions dates each app by its last commit
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
      - name: Stamp service worker versions
        if: steps.gate.outputs.go == 'true'
        run: if [ -f tools/stamp-versions.mjs ]; then node tools/stamp-versions.mjs; fi
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = beta ]; then npx --yes wrangler@4 deploy --env beta
          else npx --yes wrangler@4 deploy; fi

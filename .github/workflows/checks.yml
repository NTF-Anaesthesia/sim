# Runs on pull requests and on main. Add the repo's own checks below; a repo with no checks yet still gets a green run.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo checks
        run: if [ -f tools/check.mjs ]; then node tools/check.mjs; else echo "No tools/check.mjs yet"; fi

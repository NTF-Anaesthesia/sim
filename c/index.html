<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../src/ui/page.css">
<link rel="stylesheet" href="../src/controller/controller.css">
<script>addEventListener('beforeinstallprompt', e => e.preventDefault());</script>
</head>
<body>
<main id="app"><p class="hint">Loading…</p></main>
<script type="module">
import { mountController } from '../src/controller/index.js';
import { isCode, normalizeCode } from '../src/shared/schema.js';
const code = normalizeCode(location.pathname.split('/')[2] ?? '');
const app = document.getElementById('app');
if (isCode(code)) mountController(app, { code });
else app.innerHTML = '<h1>Controller</h1><form id="join"><label class="label" for="c">Room code, or scan the QR on the monitor with the camera</label><input id="c" maxlength="6" autocapitalize="characters" autocomplete="off" aria-label="Room code"><button type="submit">Join</button></form><p><a href="../">Start a new room</a></p>';
document.getElementById('join')?.addEventListener('submit', (e) => { e.preventDefault(); const v = normalizeCode(document.getElementById('c').value); if (isCode(v)) location.href = v; else document.getElementById('c').setAttribute('aria-invalid', 'true'); });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
</body>
</html>
